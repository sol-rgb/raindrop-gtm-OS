# The hourly tick, on GitHub Actions for the same reason as Raindrop OS: a
# scheduled workflow is the same container as a manual run, with the same
# secrets, and there is no builder in between. Railway (or Vercel) keeps the
# web app; this is the part that only needs to run for a minute an hour.
name: Hourly sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node worker/run.js --source cron
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_POOL_IDLE_MS: "30000"
          INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
          HEYREACH_API_KEY_ZUBIN: ${{ secrets.HEYREACH_API_KEY_ZUBIN }}
          HEYREACH_API_KEY_MICHAEL: ${{ secrets.HEYREACH_API_KEY_MICHAEL }}
          HUBSPOT_SERVICE_KEY: ${{ secrets.HUBSPOT_SERVICE_KEY }}
