# The hourly tick.
#
# This used to run the sync inside the GitHub runner, which needs the
# database URL and every API key as repository secrets. Those live in Vercel,
# not here, so every scheduled run failed on "DATABASE_URL is not set".
#
# Now the runner only knocks on the live app's own sync endpoint, which
# already holds every secret. One repository secret is needed, CRON_SECRET,
# the same value as in Vercel. Without it the job skips with a note instead
# of failing, because Vercel's daily cron keeps the data fresh regardless.
#
# GitHub runs scheduled workflows on a best-effort basis, so "hourly" means
# roughly hourly, sometimes a few hours apart when GitHub is busy.
name: Hourly sync

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run the sync on the live app
        env:
          SYNC_URL: https://raindrop-gtm-os.vercel.app/api/cron/sync?source=github
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::notice title=Sync skipped::Add a repository secret named CRON_SECRET (same value as in Vercel) to run the sync hourly. Vercel's daily sync still runs."
            exit 0
          fi
          code=$(curl -sS -o result.json -w "%{http_code}" -m 300 \
            -H "Authorization: Bearer $CRON_SECRET" "$SYNC_URL" || echo "000")
          cat result.json 2>/dev/null; echo
          if [ "$code" != "200" ]; then
            echo "::error title=Sync failed::The app answered HTTP $code. Check /system on the dashboard for which source failed."
            exit 1
          fi
